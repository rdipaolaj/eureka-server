name: Deploy to Fly.io

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Eureka Server
    runs-on: ubuntu-latest
    steps:
      # 1. Clona tu repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Instala flyctl
      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> $GITHUB_PATH

      # 3. Autentica con tu token
      - name: Authenticate Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl auth token

      # 4. Despliega usando tu Dockerfile y fly.toml
      - name: Deploy to Fly.io
        run: flyctl deploy --config fly.toml --dockerfile Dockerfile --app eureka-server --detach
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
